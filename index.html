<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MacroPulse AI</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#09090b">
    <script src="[https://cdn.tailwindcss.com](https://cdn.tailwindcss.com)"></script>
    <link href="[https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css](https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css)" rel="stylesheet">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #09090b;
            color: #f4f4f5;
            -webkit-tap-highlight-color: transparent;
        }
        .glass {
            background: rgba(24, 24, 27, 0.8);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .progress-ring { transition: stroke-dashoffset 0.5s ease-in-out; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="pb-24 pt-4 px-4 min-h-screen flex flex-col justify-between max-w-md mx-auto">

    <!-- Header -->
    <header class="flex justify-between items-center mb-5 pt-2">
        <div>
            <h1 class="text-2xl font-bold bg-gradient-to-r from-emerald-400 to-cyan-400 bg-clip-text text-transparent">MacroPulse AI</h1>
            <p class="text-xs text-zinc-400" id="current-date">Today</p>
        </div>
        <button onclick="openSettings()" class="w-10 h-10 rounded-full glass flex items-center justify-center text-zinc-300 hover:text-white transition">
            <i class="fa-solid fa-gear"></i>
        </button>
    </header>

    <!-- Daily Progress Summary Card -->
    <section class="glass rounded-3xl p-5 mb-4 shadow-xl">
        <div class="flex justify-between items-center mb-4">
            <span class="text-xs font-semibold uppercase tracking-wider text-zinc-400">Daily Summary</span>
            <span class="text-xs text-emerald-400 bg-emerald-950/60 px-2.5 py-1 rounded-full border border-emerald-800/50" id="cal-remaining">0 kcal left</span>
        </div>

        <!-- Calories Circular Progress -->
        <div class="flex items-center justify-around mb-6">
            <div class="relative w-32 h-32 flex items-center justify-center">
                <svg class="w-full h-full transform -rotate-90" viewBox="0 0 36 36">
                    <path class="text-zinc-800" stroke-width="3.5" stroke="currentColor" fill="none" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831"/>
                    <path id="cal-ring" class="text-emerald-500 progress-ring" stroke-dasharray="100, 100" stroke-dashoffset="100" stroke-width="3.5" stroke-linecap="round" stroke="currentColor" fill="none" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831"/>
                </svg>
                <div class="absolute text-center">
                    <span class="text-2xl font-extrabold" id="cal-consumed">0</span>
                    <span class="block text-[10px] uppercase text-zinc-400 font-medium">/ <span id="cal-target">2000</span> kcal</span>
                </div>
            </div>
        </div>

        <!-- Macros Breakdown Bars -->
        <div class="grid grid-cols-3 gap-3 pt-2 border-t border-zinc-800">
            <!-- Protein -->
            <div>
                <div class="flex justify-between text-xs mb-1">
                    <span class="text-zinc-400 font-medium">Protein</span>
                    <span class="font-semibold text-rose-400"><span id="p-val">0</span>/<span id="p-target">150</span>g</span>
                </div>
                <div class="w-full bg-zinc-800 h-1.5 rounded-full overflow-hidden">
                    <div id="p-bar" class="bg-rose-500 h-full rounded-full transition-all duration-500" style="width: 0%"></div>
                </div>
            </div>
            <!-- Carbs -->
            <div>
                <div class="flex justify-between text-xs mb-1">
                    <span class="text-zinc-400 font-medium">Carbs</span>
                    <span class="font-semibold text-amber-400"><span id="c-val">0</span>/<span id="c-target">200</span>g</span>
                </div>
                <div class="w-full bg-zinc-800 h-1.5 rounded-full overflow-hidden">
                    <div id="c-bar" class="bg-amber-500 h-full rounded-full transition-all duration-500" style="width: 0%"></div>
                </div>
            </div>
            <!-- Fat -->
            <div>
                <div class="flex justify-between text-xs mb-1">
                    <span class="text-zinc-400 font-medium">Fat</span>
                    <span class="font-semibold text-sky-400"><span id="f-val">0</span>/<span id="f-target">65</span>g</span>
                </div>
                <div class="w-full bg-zinc-800 h-1.5 rounded-full overflow-hidden">
                    <div id="f-bar" class="bg-sky-500 h-full rounded-full transition-all duration-500" style="width: 0%"></div>
                </div>
            </div>
        </div>
    </section>

    <!-- Food Search Bar Section -->
    <section class="glass rounded-2xl p-4 mb-4">
        <label class="block text-xs font-bold uppercase tracking-wider text-zinc-400 mb-2">Search Food & Meals</label>
        <form onsubmit="handleSearchSubmit(event)" class="relative flex items-center gap-2">
            <div class="relative w-full">
                <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-zinc-500 text-xs"></i>
                <input type="text" id="food-search-input" placeholder="e.g. skim milk iced latte, 10% beef mince 200g..." class="w-full bg-zinc-900 border border-zinc-700 rounded-xl pl-9 pr-3 py-2.5 text-xs text-zinc-100 placeholder-zinc-500 focus:outline-none focus:border-emerald-500">
            </div>
            <button type="submit" class="px-4 py-2.5 bg-emerald-500 hover:bg-emerald-600 text-zinc-950 font-bold text-xs rounded-xl transition shadow-lg shrink-0">
                Search
            </button>
        </form>
        <!-- Quick Search Pills -->
        <div class="flex gap-2 mt-2.5 overflow-x-auto pb-1 text-[11px] no-scrollbar">
            <button onclick="quickSearch('Skim milk iced latte')" class="px-2.5 py-1 bg-zinc-800 hover:bg-zinc-700 text-zinc-300 rounded-lg shrink-0 transition">☕ Iced Latte</button>
            <button onclick="quickSearch('10% fat beef mince 200g cooked')" class="px-2.5 py-1 bg-zinc-800 hover:bg-zinc-700 text-zinc-300 rounded-lg shrink-0 transition">🥩 Beef Mince 200g</button>
            <button onclick="quickSearch('Chicken breast 200g cooked')" class="px-2.5 py-1 bg-zinc-800 hover:bg-zinc-700 text-zinc-300 rounded-lg shrink-0 transition">🍗 Chicken Breast</button>
            <button onclick="quickSearch('Sweet potato 250g baked')" class="px-2.5 py-1 bg-zinc-800 hover:bg-zinc-700 text-zinc-300 rounded-lg shrink-0 transition">🍠 Sweet Potato</button>
        </div>
    </section>

    <!-- AI Tools Section -->
    <section class="space-y-3 mb-5">
        <!-- Scan / Camera Action -->
        <div class="glass rounded-2xl p-4 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-12 h-12 rounded-xl bg-gradient-to-br from-emerald-500 to-teal-600 flex items-center justify-center text-white text-lg shadow-lg">
                    <i class="fa-solid fa-camera"></i>
                </div>
                <div>
                    <h2 class="text-sm font-bold">Log Food with Photo</h2>
                    <p class="text-xs text-zinc-400">Snap a photo + add details</p>
                </div>
            </div>
            <button onclick="triggerFileInput()" class="px-4 py-2 bg-emerald-500 hover:bg-emerald-600 text-zinc-950 font-bold text-xs rounded-xl transition shadow-lg">
                Scan Meal
            </button>
            <input type="file" id="image-input" accept="image/*" class="hidden" onchange="handleImageSelect(event)">
        </div>

        <!-- AI Meal Recommender Button -->
        <div class="glass rounded-2xl p-4 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-12 h-12 rounded-xl bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center text-white text-lg shadow-lg">
                    <i class="fa-solid fa-wand-magic-sparkles"></i>
                </div>
                <div>
                    <h2 class="text-sm font-bold">AI Meal Recommender</h2>
                    <p class="text-xs text-zinc-400">Get ideas for remaining macros</p>
                </div>
            </div>
            <button onclick="generateMealIdeas()" class="px-4 py-2 bg-indigo-500 hover:bg-indigo-600 text-white font-bold text-xs rounded-xl transition shadow-lg">
                Suggest
            </button>
        </div>
    </section>

    <!-- Logged Meals Timeline -->
    <section class="glass rounded-3xl p-5 mb-6 flex-1">
        <div class="flex justify-between items-center mb-4">
            <h3 class="text-sm font-bold uppercase tracking-wider text-zinc-400">Today's Timeline</h3>
            <button onclick="clearTodayLog()" class="text-xs text-zinc-500 hover:text-rose-400 transition">Reset Log</button>
        </div>
        <div id="meal-timeline" class="space-y-3">
            <p class="text-xs text-zinc-500 text-center py-6">No meals logged yet today. Search or scan to start!</p>
        </div>
    </section>

    <!-- Settings Modal -->
    <div id="settings-modal" class="fixed inset-0 bg-black/80 backdrop-blur-md hidden flex items-center justify-center p-4 z-50">
        <div class="glass rounded-3xl p-6 w-full max-w-sm space-y-4">
            <div class="flex justify-between items-center border-b border-zinc-800 pb-3">
                <h3 class="text-base font-bold">App Settings</h3>
                <button onclick="closeSettings()" class="text-zinc-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            
            <div class="space-y-3">
                <div>
                    <label class="block text-xs text-zinc-400 mb-1">Gemini API Key</label>
                    <input type="password" id="api-key-input" placeholder="Paste key here..." class="w-full bg-zinc-900 border border-zinc-700 rounded-xl px-3 py-2 text-xs text-zinc-200 focus:outline-none focus:border-emerald-500">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-xs text-zinc-400 mb-1">Daily Calories</label>
                        <input type="number" id="target-cal" class="w-full bg-zinc-900 border border-zinc-700 rounded-xl px-3 py-2 text-xs text-zinc-200">
                    </div>
                    <div>
                        <label class="block text-xs text-zinc-400 mb-1">Protein (g)</label>
                        <input type="number" id="target-p" class="w-full bg-zinc-900 border border-zinc-700 rounded-xl px-3 py-2 text-xs text-zinc-200">
                    </div>
                    <div>
                        <label class="block text-xs text-zinc-400 mb-1">Carbs (g)</label>
                        <input type="number" id="target-c" class="w-full bg-zinc-900 border border-zinc-700 rounded-xl px-3 py-2 text-xs text-zinc-200">
                    </div>
                    <div>
                        <label class="block text-xs text-zinc-400 mb-1">Fat (g)</label>
                        <input type="number" id="target-f" class="w-full bg-zinc-900 border border-zinc-700 rounded-xl px-3 py-2 text-xs text-zinc-200">
                    </div>
                </div>
            </div>

            <button onclick="saveSettings()" class="w-full py-3 bg-emerald-500 text-zinc-950 font-bold rounded-xl text-xs shadow-lg hover:bg-emerald-400 transition">
                Save & Apply Settings
            </button>
        </div>
    </div>

    <!-- AI Output / Dynamic Modal -->
    <div id="ai-modal" class="fixed inset-0 bg-black/80 backdrop-blur-md hidden flex items-center justify-center p-4 z-50">
        <div class="glass rounded-3xl p-6 w-full max-w-sm space-y-4 max-h-[85vh] overflow-y-auto">
            <div class="flex justify-between items-center border-b border-zinc-800 pb-3">
                <h3 class="text-base font-bold" id="ai-modal-title">AI Output</h3>
                <button onclick="closeAiModal()" class="text-zinc-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>

            <div id="ai-modal-content" class="space-y-3">
                <!-- Dynamic Content Here -->
            </div>
        </div>
    </div>

    <!-- JavaScript Application Logic -->
    <script>
        const DEFAULT_SETTINGS = { apiKey: '', cal: 2200, p: 160, c: 220, f: 70 };
        let settings = JSON.parse(localStorage.getItem('mp_settings')) || DEFAULT_SETTINGS;
        let meals = JSON.parse(localStorage.getItem('mp_meals')) || [];

        document.getElementById('current-date').innerText = new Date().toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });

        function initApp() {
            updateDashboard();
            renderTimeline();
        }

        function updateDashboard() {
            const consumed = meals.reduce((acc, m) => ({
                cal: acc.cal + m.cal,
                p: acc.p + m.p,
                c: acc.c + m.c,
                f: acc.f + m.f
            }), { cal: 0, p: 0, c: 0, f: 0 });

            document.getElementById('cal-consumed').innerText = consumed.cal;
            document.getElementById('cal-target').innerText = settings.cal;
            
            const remCal = Math.max(0, settings.cal - consumed.cal);
            document.getElementById('cal-remaining').innerText = `${remCal} kcal left`;

            const percentCal = settings.cal > 0 ? Math.min(100, Math.round((consumed.cal / settings.cal) * 100)) : 0;
            document.getElementById('cal-ring').setAttribute('stroke-dashoffset', 100 - percentCal);

            // Macros
            document.getElementById('p-val').innerText = consumed.p;
            document.getElementById('p-target').innerText = settings.p;
            document.getElementById('p-bar').style.width = `${settings.p > 0 ? Math.min(100, (consumed.p / settings.p) * 100) : 0}%`;

            document.getElementById('c-val').innerText = consumed.c;
            document.getElementById('c-target').innerText = settings.c;
            document.getElementById('c-bar').style.width = `${settings.c > 0 ? Math.min(100, (consumed.c / settings.c) * 100) : 0}%`;

            document.getElementById('f-val').innerText = consumed.f;
            document.getElementById('f-target').innerText = settings.f;
            document.getElementById('f-bar').style.width = `${settings.f > 0 ? Math.min(100, (consumed.f / settings.f) * 100) : 0}%`;
        }

        function renderTimeline() {
            const container = document.getElementById('meal-timeline');
            if (meals.length === 0) {
                container.innerHTML = '<p class="text-xs text-zinc-500 text-center py-6">No meals logged yet today. Search or scan to start!</p>';
                return;
            }

            container.innerHTML = meals.map((m, index) => `
                <div class="flex items-center justify-between p-3 bg-zinc-900/60 rounded-2xl border border-zinc-800">
                    <div>
                        <h4 class="text-xs font-bold text-zinc-200">${escapeHtml(m.name)}</h4>
                        <p class="text-[10px] text-zinc-400 mt-0.5">
                            <span class="text-rose-400">${m.p}g P</span> • 
                            <span class="text-amber-400">${m.c}g C</span> • 
                            <span class="text-sky-400">${m.f}g F</span>
                        </p>
                    </div>
                    <div class="flex items-center gap-3">
                        <span class="text-xs font-bold text-emerald-400">${m.cal} kcal</span>
                        <button onclick="deleteMeal(${index})" class="text-zinc-600 hover:text-rose-400 text-xs"><i class="fa-solid fa-trash"></i></button>
                    </div>
                </div>
            `).join('');
        }

        /* --- Gemini API Call Wrapper with Markdown Stripping & Valid Model Endpoints --- */
        async function callGeminiApi(prompt, base64Image = null) {
            // Strictly active and valid Flash endpoints
            const models = [
                'gemini-3.8-flash',
                'gemini-3.6-flash',
                'gemini-3.5-flash',
                'gemini-2.5-flash'
            ];

            let lastError = null;

            for (const model of models) {
                try {
                    const parts = [{ text: prompt }];
                    if (base64Image) {
                        parts.push({
                            inline_data: { mime_type: "image/jpeg", data: base64Image }
                        });
                    }

                    const res = await fetch(`[https://generativelanguage.googleapis.com/v1beta/models/$](https://generativelanguage.googleapis.com/v1beta/models/$){model}:generateContent?key=${settings.apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts }],
                            generationConfig: { response_mime_type: "application/json" }
                        })
                    });

                    const data = await res.json();
                    if (data.error) throw new Error(data.error.message || `API error on ${model}`);

                    if (!data.candidates || !data.candidates[0] || !data.candidates[0].content) {
                        throw new Error("No response candidates returned.");
                    }

                    let rawText = data.candidates[0].content.parts[0].text;

                    // Clean markdown code fence blocks if returned by the API
                    rawText = rawText.replace(/^```(?:json)?\s*/i, '').replace(/\s*```$/i, '').trim();

                    return JSON.parse(rawText);
                } catch (err) {
                    console.warn(`Model ${model} request error:`, err.message);
                    lastError = err;
                }
            }

            throw new Error(lastError ? lastError.message : "Failed to query Gemini API. Please verify your API key in Settings.");
        }

        /* --- Food & Meal Search Feature --- */
        function handleSearchSubmit(e) {
            e.preventDefault();
            const query = document.getElementById('food-search-input').value;
            searchFood(query);
        }

        function quickSearch(query) {
            document.getElementById('food-search-input').value = query;
            searchFood(query);
        }

        async function searchFood(query) {
            if (!query || !query.trim()) return;
            if (!settings.apiKey) {
                alert('Please enter your Gemini API key in Settings first!');
                openSettings();
                return;
            }

            openAiModal('Searching Food Database...', `
                <div class="text-center py-8">
                    <i class="fa-solid fa-magnifying-glass fa-spin text-2xl text-emerald-400"></i>
                    <p class="text-xs text-zinc-400 mt-2">Looking up nutritional data for "${escapeHtml(query)}"...</p>
                </div>
            `);

            const prompt = `You are a strict nutritional calculation API. Provide accurate nutritional values for: "${query}".
            Return 2 to 3 accurate serving variations or common serving sizes.
            Respond strictly in valid JSON using this exact structure:
            {
              "results": [
                {
                  "name": "Food or Meal Item Name",
                  "serving": "e.g. 1 cup (250ml) or 200g cooked",
                  "cal": 250,
                  "p": 30,
                  "c": 5,
                  "f": 12,
                  "description": "Brief description of preparation/portion"
                }
              ]
            }`;

            try {
                const data = await callGeminiApi(prompt);
                if (!data || !data.results || data.results.length === 0) {
                    openAiModal('No Results', '<p class="text-xs text-zinc-400 py-4 text-center">No nutritional data found for this item. Try a different search term.</p>');
                    return;
                }

                window.currentSearchResults = data.results;

                const html = data.results.map((item, idx) => `
                    <div class="p-3 bg-zinc-900/80 rounded-2xl border border-zinc-800 space-y-2">
                        <div class="flex justify-between items-start">
                            <div>
                                <h4 class="text-xs font-bold text-emerald-300">${escapeHtml(item.name)}</h4>
                                <span class="text-[10px] text-zinc-400">${escapeHtml(item.serving || '')}</span>
                            </div>
                            <span class="text-xs font-bold text-emerald-400 bg-emerald-950/60 px-2 py-0.5 rounded-full border border-emerald-800/40">${item.cal} kcal</span>
                        </div>
                        ${item.description ? `<p class="text-[11px] text-zinc-400">${escapeHtml(item.description)}</p>` : ''}
                        <div class="flex justify-between items-center pt-1 border-t border-zinc-800 text-[10px]">
                            <span class="text-zinc-300">
                                <strong class="text-rose-400">${item.p}g</strong> P • 
                                <strong class="text-amber-400">${item.c}g</strong> C • 
                                <strong class="text-sky-400">${item.f}g</strong> F
                            </span>
                            <button onclick="logSearchResultByIndex(${idx})" class="px-3 py-1 bg-emerald-500 hover:bg-emerald-400 text-zinc-950 font-bold rounded-lg transition">
                                + Log
                            </button>
                        </div>
                    </div>
                `).join('');

                openAiModal(`Results for "${escapeHtml(query)}"`, `<div class="space-y-3">${html}</div>`);
            } catch (err) {
                openAiModal('Error', `<p class="text-xs text-rose-400">${escapeHtml(err.message || 'Failed to search food items.')}</p>`);
            }
        }

        function logSearchResultByIndex(idx) {
            if (window.currentSearchResults && window.currentSearchResults[idx]) {
                const item = window.currentSearchResults[idx];
                meals.push({
                    name: item.name,
                    cal: parseInt(item.cal) || 0,
                    p: parseInt(item.p) || 0,
                    c: parseInt(item.c) || 0,
                    f: parseInt(item.f) || 0
                });
                localStorage.setItem('mp_meals', JSON.stringify(meals));
                initApp();
                closeAiModal();
            }
        }

        /* --- Photo Scanning Feature with Extra Context Notes --- */
        function triggerFileInput() {
            if (!settings.apiKey) {
                alert('Please enter your Gemini API key in Settings first!');
                openSettings();
                return;
            }
            document.getElementById('image-input').click();
        }

        function handleImageSelect(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                window.pendingImageBase64 = e.target.result.split(',')[1];
                window.pendingImagePreview = e.target.result;

                openAiModal('Add Photo Context', `
                    <div class="space-y-3">
                        <div class="w-full h-40 bg-zinc-900 rounded-2xl overflow-hidden border border-zinc-800 flex items-center justify-center">
                            <img src="${window.pendingImagePreview}" class="h-full w-full object-cover">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-zinc-300 mb-1">Additional Details (Optional)</label>
                            <input type="text" id="scan-notes-input" placeholder="e.g. skim milk, sourdough bread, cooked in butter..." class="w-full bg-zinc-900 border border-zinc-700 rounded-xl px-3 py-2.5 text-xs text-zinc-100 placeholder-zinc-500 focus:outline-none focus:border-emerald-500">
                            <p class="text-[10px] text-zinc-500 mt-1">Specify hidden details like milk type, oils, bread, or exact weights.</p>
                        </div>
                        <button onclick="processImageWithNotes()" class="w-full py-3 bg-emerald-500 hover:bg-emerald-400 text-zinc-950 font-bold rounded-xl text-xs shadow-lg transition">
                            Analyze Meal
                        </button>
                    </div>
                `);
            };
            reader.readAsDataURL(file);
            event.target.value = '';
        }

        async function processImageWithNotes() {
            const notes = document.getElementById('scan-notes-input') ? document.getElementById('scan-notes-input').value.trim() : '';
            const base64Data = window.pendingImageBase64;
            if (!base64Data) return;

            openAiModal('Analyzing Meal...', '<div class="text-center py-8"><i class="fa-solid fa-spinner fa-spin text-2xl text-emerald-400"></i><p class="text-xs text-zinc-400 mt-2">Gemini Vision is estimating macros...</p></div>');

            try {
                let prompt = `Analyze this meal photo. Output strictly valid JSON matching this exact structure:
                {
                  "name": "Brief Meal Name",
                  "cal": 500,
                  "p": 35,
                  "c": 45,
                  "f": 15,
                  "description": "Short overview of identified items"
                }`;

                if (notes) {
                    prompt += `\n\nUSER SPECIFIED DETAILS TO INCLUDE: "${notes}". Make sure calorie and macronutrient calculations accurately reflect these context notes.`;
                }

                const result = await callGeminiApi(prompt, base64Data);
                showScanResults(result);
            } catch (err) {
                openAiModal('Error', `<p class="text-xs text-rose-400">${escapeHtml(err.message || 'Failed to analyze image.')}</p>`);
            }
        }

        function showScanResults(meal) {
            const html = `
                <div class="space-y-3">
                    <input type="text" id="edit-meal-name" value="${escapeHtml(meal.name || 'Meal')}" class="w-full bg-zinc-900 border border-zinc-700 rounded-xl p-2 text-xs font-bold text-zinc-100">
                    <p class="text-[11px] text-zinc-400">${escapeHtml(meal.description || '')}</p>
                    <div class="grid grid-cols-4 gap-2 text-center">
                        <div class="bg-zinc-900 p-2 rounded-xl">
                            <span class="block text-[10px] text-zinc-400">Calories</span>
                            <input type="number" id="edit-meal-cal" value="${meal.cal || 0}" class="w-full text-center bg-transparent text-xs font-bold text-emerald-400">
                        </div>
                        <div class="bg-zinc-900 p-2 rounded-xl">
                            <span class="block text-[10px] text-zinc-400">Protein</span>
                            <input type="number" id="edit-meal-p" value="${meal.p || 0}" class="w-full text-center bg-transparent text-xs font-bold text-rose-400">
                        </div>
                        <div class="bg-zinc-900 p-2 rounded-xl">
                            <span class="block text-[10px] text-zinc-400">Carbs</span>
                            <input type="number" id="edit-meal-c" value="${meal.c || 0}" class="w-full text-center bg-transparent text-xs font-bold text-amber-400">
                        </div>
                        <div class="bg-zinc-900 p-2 rounded-xl">
                            <span class="block text-[10px] text-zinc-400">Fat</span>
                            <input type="number" id="edit-meal-f" value="${meal.f || 0}" class="w-full text-center bg-transparent text-xs font-bold text-sky-400">
                        </div>
                    </div>
                    <button onclick="confirmLogMeal()" class="w-full py-3 bg-emerald-500 text-zinc-950 font-bold rounded-xl text-xs mt-2 shadow-lg">Log This Meal</button>
                </div>
            `;
            openAiModal('Confirm Meal Details', html);
        }

        function confirmLogMeal() {
            const newMeal = {
                name: document.getElementById('edit-meal-name').value || 'Meal',
                cal: parseInt(document.getElementById('edit-meal-cal').value) || 0,
                p: parseInt(document.getElementById('edit-meal-p').value) || 0,
                c: parseInt(document.getElementById('edit-meal-c').value) || 0,
                f: parseInt(document.getElementById('edit-meal-f').value) || 0
            };
            meals.push(newMeal);
            localStorage.setItem('mp_meals', JSON.stringify(meals));
            initApp();
            closeAiModal();
        }

        /* --- Meal Ideas Recommender Feature --- */
        async function generateMealIdeas() {
            if (!settings.apiKey) {
                alert('Please enter your Gemini API key in Settings first!');
                openSettings();
                return;
            }

            const consumed = meals.reduce((acc, m) => ({ cal: acc.cal + m.cal, p: acc.p + m.p, c: acc.c + m.c, f: acc.f + m.f }), { cal: 0, p: 0, c: 0, f: 0 });
            const rem = {
                cal: Math.max(0, settings.cal - consumed.cal),
                p: Math.max(0, settings.p - consumed.p),
                c: Math.max(0, settings.c - consumed.c),
                f: Math.max(0, settings.f - consumed.f)
            };

            openAiModal('Generating Suggestions...', '<div class="text-center py-8"><i class="fa-solid fa-wand-magic-sparkles fa-spin text-2xl text-indigo-400"></i><p class="text-xs text-zinc-400 mt-2">Calculating meals to fit your exact remaining macros...</p></div>');

            const prompt = `Suggest 2 realistic meal options to fit these remaining daily macros: Calories: ${rem.cal}, Protein: ${rem.p}g, Carbs: ${rem.c}g, Fat: ${rem.f}g.
            Return strictly valid JSON using format:
            {
              "suggestions": [
                { "name": "Meal Name", "cal": 400, "p": 30, "c": 40, "f": 10, "prep": "10 mins", "ingredients": "Item 1, Item 2" }
              ]
            }`;

            try {
                const result = await callGeminiApi(prompt);
                window.currentSuggestions = result.suggestions;

                const html = result.suggestions.map((s, idx) => `
                    <div class="p-3 bg-zinc-900/80 rounded-2xl border border-zinc-800 space-y-2">
                        <div class="flex justify-between items-center">
                            <h4 class="text-xs font-bold text-indigo-300">${escapeHtml(s.name)}</h4>
                            <span class="text-[10px] text-zinc-500">${escapeHtml(s.prep)}</span>
                        </div>
                        <p class="text-[11px] text-zinc-400">${escapeHtml(s.ingredients)}</p>
                        <div class="flex justify-between items-center pt-1 border-t border-zinc-800 text-[10px]">
                            <span class="text-emerald-400 font-bold">${s.cal} kcal</span>
                            <span class="text-zinc-400">${s.p}g P / ${s.c}g C / ${s.f}g F</span>
                            <button onclick="logSuggestedMealByIndex(${idx})" class="px-2.5 py-1 bg-indigo-500/20 text-indigo-300 rounded-lg hover:bg-indigo-500/40">Log</button>
                        </div>
                    </div>
                `).join('');

                openAiModal('Tailored Meal Suggestions', `<div class="space-y-3">${html}</div>`);
            } catch (err) {
                openAiModal('Error', `<p class="text-xs text-rose-400">${escapeHtml(err.message || 'Failed to generate suggestions.')}</p>`);
            }
        }

        function logSuggestedMealByIndex(idx) {
            if (window.currentSuggestions && window.currentSuggestions[idx]) {
                const s = window.currentSuggestions[idx];
                meals.push({ name: s.name, cal: s.cal, p: s.p, c: s.c, f: s.f });
                localStorage.setItem('mp_meals', JSON.stringify(meals));
                initApp();
                closeAiModal();
            }
        }

        /* --- Helper & Utility Functions --- */
        function deleteMeal(index) {
            meals.splice(index, 1);
            localStorage.setItem('mp_meals', JSON.stringify(meals));
            initApp();
        }

        function clearTodayLog() {
            if (confirm('Are you sure you want to clear today\'s logged meals?')) {
                meals = [];
                localStorage.setItem('mp_meals', JSON.stringify(meals));
                initApp();
            }
        }

        function openSettings() {
            document.getElementById('api-key-input').value = settings.apiKey || '';
            document.getElementById('target-cal').value = settings.cal;
            document.getElementById('target-p').value = settings.p;
            document.getElementById('target-c').value = settings.c;
            document.getElementById('target-f').value = settings.f;
            document.getElementById('settings-modal').classList.remove('hidden');
        }

        function closeSettings() {
            document.getElementById('settings-modal').classList.add('hidden');
        }

        function saveSettings() {
            settings.apiKey = document.getElementById('api-key-input').value.trim();
            settings.cal = parseInt(document.getElementById('target-cal').value) || 2000;
            settings.p = parseInt(document.getElementById('target-p').value) || 150;
            settings.c = parseInt(document.getElementById('target-c').value) || 200;
            settings.f = parseInt(document.getElementById('target-f').value) || 65;
            localStorage.setItem('mp_settings', JSON.stringify(settings));
            closeSettings();
            initApp();
        }

        function openAiModal(title, htmlContent) {
            document.getElementById('ai-modal-title').innerText = title;
            document.getElementById('ai-modal-content').innerHTML = htmlContent;
            document.getElementById('ai-modal').classList.remove('hidden');
        }

        function closeAiModal() {
            document.getElementById('ai-modal').classList.add('hidden');
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        // Run application initialization
        initApp();
    </script>
</body>
</html>
