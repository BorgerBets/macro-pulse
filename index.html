<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MacroPulse AI</title>
  <style>
    :root {
      --bg: #0d1117;
      --card: #161b22;
      --border: #30363d;
      --text: #f0f6fc;
      --subtext: #8b949e;
      --accent: #3fb950;
      --protein: #ff7b72;
      --carbs: #79c0ff;
      --fat: #d2a8ff;
      --btn-bg: #21262d;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 16px; max-width: 600px; margin: 0 auto; padding-bottom: 80px; }

    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    h1 { font-size: 1.4rem; font-weight: 700; background: linear-gradient(90deg, #3fb950, #79c0ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
    
    /* Date Nav */
    .date-nav { display: flex; justify-content: space-between; align-items: center; }
    .date-nav button { background: var(--btn-bg); border: 1px solid var(--border); color: var(--text); padding: 8px 12px; border-radius: 8px; cursor: pointer; }
    .date-nav h2 { font-size: 1.1rem; cursor: pointer; }

    /* Target Bars */
    .macro-overview { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 8px; text-align: center; margin-top: 12px; }
    .macro-box { background: rgba(255,255,255,0.03); padding: 8px; border-radius: 8px; }
    .macro-box .val { font-size: 1.1rem; font-weight: bold; }
    .macro-box .label { font-size: 0.75rem; color: var(--subtext); }

    .progress-bar-bg { background: var(--border); height: 6px; border-radius: 3px; overflow: hidden; margin-top: 4px; }
    .progress-bar-fill { height: 100%; width: 0%; transition: width 0.3s ease; }

    /* AI & Quick Add Inputs */
    .input-group { display: flex; gap: 8px; margin-bottom: 8px; }
    input, select, button { font-size: 0.9rem; }
    input[type="text"], input[type="number"], select { background: var(--btn-bg); border: 1px solid var(--border); color: var(--text); padding: 10px; border-radius: 8px; flex: 1; }
    .btn-primary { background: var(--accent); color: #000; font-weight: 600; border: none; padding: 10px 16px; border-radius: 8px; cursor: pointer; }
    .btn-sec { background: var(--btn-bg); color: var(--text); border: 1px solid var(--border); padding: 10px 16px; border-radius: 8px; cursor: pointer; }

    /* Meal Sections */
    .meal-section { margin-top: 12px; }
    .meal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 6px; margin-bottom: 8px; }
    .meal-title { font-weight: 600; text-transform: capitalize; }
    .meal-macros { font-size: 0.8rem; color: var(--subtext); }

    .food-item { display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.02); padding: 8px; border-radius: 6px; margin-bottom: 6px; font-size: 0.85rem; }
    .food-info { flex: 1; }
    .food-sub { font-size: 0.75rem; color: var(--subtext); }
    .del-btn { background: none; border: none; color: var(--protein); cursor: pointer; font-size: 1rem; padding: 0 6px; }

    /* Weight Log Widget */
    .weight-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; }

    /* Modal */
    .modal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; z-index: 100; }
    .modal-content { background: var(--card); padding: 20px; border-radius: 12px; max-width: 400px; width: 90%; border: 1px solid var(--border); }
    
    .loading-overlay { display: none; color: var(--accent); font-weight: bold; text-align: center; margin-top: 8px; font-size: 0.85rem; }
  </style>
</head>
<body>

  <header>
    <h1>MacroPulse AI</h1>
    <div>
      <button class="btn-sec" onclick="openSettings()">⚙ Settings</button>
    </div>
  </header>

  <!-- Date Navigation -->
  <div class="card date-nav">
    <button onclick="changeDate(-1)">&larr; Prev</button>
    <div style="text-align: center;">
      <h2 id="displayDate" onclick="document.getElementById('datePicker').showPicker()">Today</h2>
      <input type="date" id="datePicker" style="display:none;" onchange="onDatePicked(this.value)">
    </div>
    <button id="nextDateBtn" onclick="changeDate(1)">Next &rarr;</button>
  </div>

  <!-- Daily Summary Dashboard -->
  <div class="card">
    <div class="macro-overview">
      <div class="macro-box">
        <div class="label">Calories</div>
        <div class="val" id="calVal">0</div>
        <div class="label" id="calTargetLabel">/ 2200</div>
        <div class="progress-bar-bg"><div class="progress-bar-fill" id="calBar" style="background: var(--accent);"></div></div>
      </div>
      <div class="macro-box">
        <div class="label">Protein</div>
        <div class="val" id="pVal" style="color: var(--protein)">0g</div>
        <div class="label" id="pTargetLabel">/ 180g</div>
        <div class="progress-bar-bg"><div class="progress-bar-fill" id="pBar" style="background: var(--protein);"></div></div>
      </div>
      <div class="macro-box">
        <div class="label">Carbs</div>
        <div class="val" id="cVal" style="color: var(--carbs)">0g</div>
        <div class="label" id="cTargetLabel">/ 220g</div>
        <div class="progress-bar-bg"><div class="progress-bar-fill" id="cBar" style="background: var(--carbs);"></div></div>
      </div>
      <div class="macro-box">
        <div class="label">Fat</div>
        <div class="val" id="fVal" style="color: var(--fat)">0g</div>
        <div class="label" id="fTargetLabel">/ 70g</div>
        <div class="progress-bar-bg"><div class="progress-bar-fill" id="fBar" style="background: var(--fat);"></div></div>
      </div>
    </div>
  </div>

  <!-- AI Text & Photo Scan Inputs -->
  <div class="card">
    <div class="input-group">
      <input type="text" id="aiInput" placeholder="AI Log: '2 eggs and 100g oats for breakfast'">
      <button class="btn-primary" onclick="parseAILog()">Log</button>
    </div>
    <div style="display: flex; gap: 8px; margin-top: 8px;">
      <button class="btn-sec" style="flex:1;" onclick="triggerPhotoUpload()">📷 Photo Scan</button>
      <button class="btn-sec" style="flex:1;" onclick="openManualAdd()">+ Manual</button>
      <button class="btn-sec" style="flex:1;" onclick="copyYesterday()">📋 Copy Prev</button>
    </div>
    <!-- Hidden input triggering native camera or gallery picker -->
    <input type="file" id="photoInput" accept="image/*" capture="environment" style="display:none;" onchange="handlePhotoUpload(event)">
    <div id="aiStatus" class="loading-overlay">Analyzing meal with Gemini AI...</div>
  </div>

  <!-- Weight & Trend Widget -->
  <div class="card weight-row">
    <div>
      <span style="font-weight: 600;">Body Weight</span>
      <span id="weightDisplay" style="color: var(--subtext); font-size: 0.85rem; margin-left: 8px;">Not logged today</span>
    </div>
    <button class="btn-sec" onclick="logWeight()">Log Weight</button>
  </div>

  <!-- Meal Groups -->
  <div class="card" id="mealLogsContainer">
    <!-- Populated by JS -->
  </div>

  <!-- Manual Add Modal -->
  <div id="manualModal" class="modal">
    <div class="modal-content">
      <h3 style="margin-bottom: 12px;">Add Food Item</h3>
      <div class="input-group"><input type="text" id="mName" placeholder="Food Name"></div>
      <div class="input-group">
        <select id="mMeal">
          <option value="breakfast">Breakfast</option>
          <option value="lunch">Lunch</option>
          <option value="dinner">Dinner</option>
          <option value="snacks">Snacks</option>
        </select>
      </div>
      <div class="input-group">
        <input type="number" id="mCal" placeholder="Calories (kcal)">
        <input type="number" id="mP" placeholder="Protein (g)">
      </div>
      <div class="input-group">
        <input type="number" id="mC" placeholder="Carbs (g)">
        <input type="number" id="mF" placeholder="Fat (g)">
      </div>
      <div style="display:flex; justify-content: space-between; margin-top: 12px;">
        <button class="btn-sec" onclick="closeModal('manualModal')">Cancel</button>
        <button class="btn-primary" onclick="submitManualAdd()">Save Item</button>
      </div>
    </div>
  </div>

  <!-- Settings Modal -->
  <div id="settingsModal" class="modal">
    <div class="modal-content">
      <h3 style="margin-bottom: 12px;">Settings & Macro Targets</h3>
      <label class="label">Gemini API Key (for AI & Photo Scanning)</label>
      <input type="text" id="cfgApiKey" placeholder="AIZASy..." style="width:100%; margin-bottom: 12px;">
      
      <label class="label">Target Calories / Protein (g)</label>
      <div class="input-group">
        <input type="number" id="cfgCal" placeholder="2200">
        <input type="number" id="cfgP" placeholder="180">
      </div>
      <label class="label">Target Carbs (g) / Fat (g)</label>
      <div class="input-group">
        <input type="number" id="cfgC" placeholder="220">
        <input type="number" id="cfgF" placeholder="70">
      </div>
      
      <div style="display:flex; justify-content: space-between; margin-top: 16px;">
        <button class="btn-sec" onclick="closeModal('settingsModal')">Cancel</button>
        <button class="btn-primary" onclick="saveSettings()">Save Targets</button>
      </div>
    </div>
  </div>

  <script>
    const MEALS = ['breakfast', 'lunch', 'dinner', 'snacks'];
    
    let store = JSON.parse(localStorage.getItem('macropulse_db')) || {
      targets: { cal: 2200, p: 180, c: 220, f: 70 },
      apiKey: '',
      logs: {}
    };

    function getTodayStr() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }

    let activeDate = getTodayStr();

    function saveStore() {
      localStorage.setItem('macropulse_db', JSON.stringify(store));
    }

    function getDayLog(dateStr) {
      if (!store.logs[dateStr]) {
        store.logs[dateStr] = {
          weight: null,
          items: { breakfast: [], lunch: [], dinner: [], snacks: [] }
        };
        saveStore();
      }
      return store.logs[dateStr];
    }

    // UI Rendering
    function renderApp() {
      const today = getTodayStr();
      const dayData = getDayLog(activeDate);

      const dateHeader = document.getElementById('displayDate');
      if (activeDate === today) {
        dateHeader.textContent = "Today";
      } else {
        dateHeader.textContent = activeDate;
      }
      document.getElementById('nextDateBtn').disabled = (activeDate >= today);

      document.getElementById('weightDisplay').textContent = dayData.weight ? `${dayData.weight} kg` : "Not logged today";

      let totals = { cal: 0, p: 0, c: 0, f: 0 };
      MEALS.forEach(m => {
        (dayData.items[m] || []).forEach(i => {
          totals.cal += Number(i.cal || 0);
          totals.p += Number(i.p || 0);
          totals.c += Number(i.c || 0);
          totals.f += Number(i.f || 0);
        });
      });

      const t = store.targets;
      document.getElementById('calVal').textContent = Math.round(totals.cal);
      document.getElementById('calTargetLabel').textContent = `/ ${t.cal}`;
      document.getElementById('calBar').style.width = Math.min(100, (totals.cal / t.cal) * 100) + '%';

      document.getElementById('pVal').textContent = Math.round(totals.p) + 'g';
      document.getElementById('pTargetLabel').textContent = `/ ${t.p}g`;
      document.getElementById('pBar').style.width = Math.min(100, (totals.p / t.p) * 100) + '%';

      document.getElementById('cVal').textContent = Math.round(totals.c) + 'g';
      document.getElementById('cTargetLabel').textContent = `/ ${t.c}g`;
      document.getElementById('cBar').style.width = Math.min(100, (totals.c / t.c) * 100) + '%';

      document.getElementById('fVal').textContent = Math.round(totals.f) + 'g';
      document.getElementById('fTargetLabel').textContent = `/ ${t.f}g`;
      document.getElementById('fBar').style.width = Math.min(100, (totals.f / t.f) * 100) + '%';

      const container = document.getElementById('mealLogsContainer');
      container.innerHTML = '';

      MEALS.forEach(meal => {
        const items = dayData.items[meal] || [];
        let mCal = items.reduce((acc, x) => acc + Number(x.cal||0), 0);
        
        let html = `
          <div class="meal-section">
            <div class="meal-header">
              <span class="meal-title">${meal}</span>
              <span class="meal-macros">${Math.round(mCal)} kcal</span>
            </div>
        `;

        if (items.length === 0) {
          html += `<div style="font-size: 0.8rem; color: var(--subtext); margin-bottom: 6px;">No entries</div>`;
        } else {
          items.forEach((item, idx) => {
            html += `
              <div class="food-item">
                <div class="food-info">
                  <div><strong>${item.name}</strong></div>
                  <div class="food-sub">${item.cal} kcal | P: ${item.p}g | C: ${item.c}g | F: ${item.f}g</div>
                </div>
                <button class="del-btn" onclick="deleteItem('${meal}', ${idx})">&times;</button>
              </div>
            `;
          });
        }
        html += `</div>`;
        container.innerHTML += html;
      });
    }

    // Date Navigation
    function changeDate(offset) {
      const parts = activeDate.split('-');
      const d = new Date(parts[0], parts[1] - 1, parts[2]);
      d.setDate(d.getDate() + offset);
      activeDate = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
      renderApp();
    }

    function onDatePicked(val) {
      if (val) {
        activeDate = val;
        renderApp();
      }
    }

    // Food Logging Logic
    function addItem(meal, name, cal, p, c, f) {
      const dayData = getDayLog(activeDate);
      if (!dayData.items[meal]) dayData.items[meal] = [];
      dayData.items[meal].push({ name, cal: Number(cal), p: Number(p), c: Number(c), f: Number(f) });
      saveStore();
      renderApp();
    }

    function deleteItem(meal, idx) {
      const dayData = getDayLog(activeDate);
      dayData.items[meal].splice(idx, 1);
      saveStore();
      renderApp();
    }

    function copyYesterday() {
      const parts = activeDate.split('-');
      const d = new Date(parts[0], parts[1] - 1, parts[2]);
      d.setDate(d.getDate() - 1);
      const prevDateStr = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
      
      const prevLog = store.logs[prevDateStr];
      if (!prevLog || !prevLog.items) {
        alert("No entries found for yesterday!");
        return;
      }

      const currentLog = getDayLog(activeDate);
      currentLog.items = JSON.parse(JSON.stringify(prevLog.items));
      saveStore();
      renderApp();
    }

    function logWeight() {
      const current = getDayLog(activeDate).weight || "";
      const val = prompt("Enter body weight in kg:", current);
      if (val !== null) {
        getDayLog(activeDate).weight = val ? parseFloat(val) : null;
        saveStore();
        renderApp();
      }
    }

    // Modals
    function openManualAdd() { document.getElementById('manualModal').style.display = 'flex'; }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }
    
    function submitManualAdd() {
      const name = document.getElementById('mName').value || 'Custom Item';
      const meal = document.getElementById('mMeal').value;
      const cal = document.getElementById('mCal').value || 0;
      const p = document.getElementById('mP').value || 0;
      const c = document.getElementById('mC').value || 0;
      const f = document.getElementById('mF').value || 0;

      addItem(meal, name, cal, p, c, f);
      closeModal('manualModal');

      document.getElementById('mName').value = '';
      document.getElementById('mCal').value = '';
      document.getElementById('mP').value = '';
      document.getElementById('mC').value = '';
      document.getElementById('mF').value = '';
    }

    function openSettings() {
      document.getElementById('cfgApiKey').value = store.apiKey || '';
      document.getElementById('cfgCal').value = store.targets.cal;
      document.getElementById('cfgP').value = store.targets.p;
      document.getElementById('cfgC').value = store.targets.c;
      document.getElementById('cfgF').value = store.targets.f;
      document.getElementById('settingsModal').style.display = 'flex';
    }

    function saveSettings() {
      store.apiKey = document.getElementById('cfgApiKey').value.trim();
      store.targets = {
        cal: Number(document.getElementById('cfgCal').value) || 2200,
        p: Number(document.getElementById('cfgP').value) || 180,
        c: Number(document.getElementById('cfgC').value) || 220,
        f: Number(document.getElementById('cfgF').value) || 70
      };
      saveStore();
      closeModal('settingsModal');
      renderApp();
    }

    function setStatus(show, msg = "Analyzing meal with Gemini AI...") {
      const el = document.getElementById('aiStatus');
      el.textContent = msg;
      el.style.display = show ? 'block' : 'none';
    }

    // Gemini AI Text Parsing
    async function parseAILog() {
      const query = document.getElementById('aiInput').value.trim();
      if (!query) return;

      if (!store.apiKey) {
        alert("Please set your Gemini API Key in Settings to use AI features.");
        openSettings();
        return;
      }

      setStatus(true, "Analyzing text description...");
      const prompt = `Analyze this food description: "${query}". Return ONLY a JSON object formatted as: {"meal": "breakfast|lunch|dinner|snacks", "name": "Item Name", "cal": 300, "p": 25, "c": 30, "f": 10}.`;

      try {
        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${store.apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
        });

        const data = await res.json();
        const textResp = data.candidates[0].content.parts[0].text;
        const cleanJson = textResp.replace(/```json|```/g, '').trim();
        const parsed = JSON.parse(cleanJson);

        addItem(parsed.meal || 'snacks', parsed.name || query, parsed.cal, parsed.p, parsed.c, parsed.f);
        document.getElementById('aiInput').value = '';
      } catch (err) {
        alert("Failed to parse text via AI. Check your API key.");
      } finally {
        setStatus(false);
      }
    }

    // Gemini AI Multimodal Photo Scanning
    function triggerPhotoUpload() {
      if (!store.apiKey) {
        alert("Please set your Gemini API Key in Settings to use Photo Scan.");
        openSettings();
        return;
      }
      document.getElementById('photoInput').click();
    }

    async function handlePhotoUpload(event) {
      const file = event.target.files[0];
      if (!file) return;

      setStatus(true, "Scanning food photo with Gemini AI...");

      const reader = new FileReader();
      reader.onload = async function() {
        const base64Data = reader.result.split(',')[1];
        const mimeType = file.type || 'image/jpeg';

        const prompt = 'Analyze this meal photo. Identify the food, estimate portion sizes, and estimate calories and macros (protein, carbs, fat). Return ONLY a JSON object formatted as: {"meal": "breakfast|lunch|dinner|snacks", "name": "Item Name", "cal": 300, "p": 25, "c": 30, "f": 10}.';

        try {
          const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${store.apiKey}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [{
                parts: [
                  { inline_data: { mime_type: mimeType, data: base64Data } },
                  { text: prompt }
                ]
              }]
            })
          });

          const data = await res.json();
          const textResp = data.candidates[0].content.parts[0].text;
          const cleanJson = textResp.replace(/```json|```/g, '').trim();
          const parsed = JSON.parse(cleanJson);

          addItem(parsed.meal || 'snacks', parsed.name || "Scanned Meal", parsed.cal, parsed.p, parsed.c, parsed.f);
        } catch (err) {
          alert("Failed to analyze image with AI. Check your API key or image format.");
        } finally {
          setStatus(false);
          event.target.value = '';
        }
      };
      reader.readAsDataURL(file);
    }

    // Auto-refresh when returning to tab
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") {
        renderApp();
      }
    });

    window.onload = () => renderApp();
  </script>
</body>
</html>
